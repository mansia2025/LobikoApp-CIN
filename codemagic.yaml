workflows:
  ios-native-workflow:
    name: Lobiko iOS Native Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build iOS App
        script: |
          xcodebuild \
            -project LobikoApp.xcodeproj \
            -scheme LobikoApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/LobikoApp.xcarchive" \
            archive CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/LobikoApp.xcarchive
