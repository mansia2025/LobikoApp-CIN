name: iOS build

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List Xcode versions
        run: ls -la /Applications/ | grep Xcode

      - name: Check project list
        run: xcodebuild -list
