name: iOS build

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build iOS App for Device
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swift / Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Build for iOS Device
        run: |
          swift package resolve
          xcodebuild -skipPackagePluginValidation -scheme LobikoApp -destination "generic/platform=iOS" -configuration Release -derivedDataPath $PWD/DerivedData build

      - name: Upload App Binary
        uses: actions/upload-artifact@v4
        with:
          name: LobikoApp-Binary
          path: DerivedData/Build/Products/Release-iphoneos/LobikoApp.app
